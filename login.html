<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2026-05-24b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TPKELE">
<script src="/pwa.js" defer></script>
<title>TPKELE — Sign In</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1a1a1a;}

.page{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;
}

/* ── Card ── */
.card{
  display:flex;
  background:#ffffff;
  border-radius:16px;
  overflow:hidden;
  width:min(960px,95vw);
  min-height:580px;
  box-shadow:0 8px 32px rgba(0,0,0,.08);
}

/* ── Brand Panel (左侧) ── */
.brand-panel{
  flex-shrink:0;
  width:420px;
  padding:60px 50px;
  position:relative;
  background:linear-gradient(135deg,#10b981 0%,#059669 100%);
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.brand-panel::before{
  content:'';
  position:absolute;
  top:-120px;
  right:-80px;
  width:400px;
  height:400px;
  background:rgba(255,255,255,.12);
  border-radius:50%;
  filter:blur(60px);
}

.brand-panel::after{
  content:'';
  position:absolute;
  bottom:-140px;
  left:-100px;
  width:480px;
  height:480px;
  background:rgba(255,255,255,.08);
  border-radius:50%;
  filter:blur(80px);
}

.brand-content{
  position:relative;
  z-index:1;
}

.brand-logo{
  margin-bottom:32px;
}

.brand-logo svg{
  width:64px;
  height:64px;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.15));
}

.brand-title{
  font-size:42px;
  font-weight:700;
  color:#ffffff;
  line-height:1.2;
  margin-bottom:16px;
  letter-spacing:-0.5px;
}

.brand-subtitle{
  font-size:16px;
  font-weight:400;
  color:rgba(255,255,255,.85);
  line-height:1.6;
  max-width:340px;
}

/* ── Login Panel (右侧) ── */
.login-panel{
  flex:1;
  padding:60px 70px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.login-header{
  margin-bottom:40px;
}

.login-title{
  font-size:28px;
  font-weight:700;
  color:#1a1a1a;
  margin-bottom:8px;
}

.login-desc{
  font-size:14px;
  color:#767676;
}

/* Input fields */
.field{
  position:relative;
  margin-bottom:24px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:500;
  color:#1a1a1a;
  margin-bottom:8px;
}

.field input{
  width:100%;
  padding:12px 16px;
  background:#f7f7f7;
  border:1.5px solid #e3e3e3;
  border-radius:8px;
  font-size:14px;
  color:#1a1a1a;
  font-family:inherit;
  outline:none;
  transition:all .2s;
}

.field input:focus{
  background:#ffffff;
  border-color:#10b981;
  box-shadow:0 0 0 3px rgba(16,185,129,.1);
}

.field input::placeholder{
  color:#a0a0a0;
}

/* Options row */
.options-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
  font-size:13px;
}

.remember-wrap{
  display:flex;
  align-items:center;
  gap:8px;
}

.remember-wrap input[type="checkbox"]{
  width:16px;
  height:16px;
  cursor:pointer;
  accent-color:#10b981;
}

.remember-wrap label{
  color:#1a1a1a;
  cursor:pointer;
  user-select:none;
}

.forgot-link{
  color:#10b981;
  text-decoration:none;
  font-weight:500;
  transition:color .2s;
}

.forgot-link:hover{
  color:#059669;
}

.err{
  color:#dc2626;
  font-size:13px;
  min-height:18px;
  margin-bottom:12px;
}

.login-btn{
  width:100%;
  padding:14px;
  background:#10b981;
  border:none;
  border-radius:8px;
  color:#ffffff;
  font-size:15px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  letter-spacing:0.3px;
  box-shadow:0 4px 12px rgba(16,185,129,.3);
  transition:all .2s;
}

.login-btn:hover{
  background:#059669;
  box-shadow:0 6px 16px rgba(16,185,129,.4);
  transform:translateY(-1px);
}

.login-btn:active{
  transform:translateY(0);
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

/* ── Footer ── */
.bottom-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:min(960px,95vw);
  margin-top:16px;
  padding:0 4px;
}

.lang-select{
  padding:6px 14px;
  background:#ffffff;
  border:1px solid #e3e3e3;
  border-radius:6px;
  color:#1a1a1a;
  font-size:12px;
  font-family:inherit;
  cursor:pointer;
  outline:none;
  transition:border-color .2s;
}

.lang-select:hover{
  border-color:#c8c8c8;
}

.lang-select option{
  background:#ffffff;
  color:#1a1a1a;
}

.status-bar{
  font-size:11px;
  color:#a0a0a0;
  letter-spacing:0.3px;
}

.status-online{color:#10b981;}
.status-offline{color:#767676;}

@media(max-width:768px){
  .brand-panel{display:none;}
  .card{min-height:auto;}
  .login-panel{padding:40px 30px;}
}

@media(max-width:480px){
  .page{padding:16px;}
  .login-panel{padding:32px 24px;}
  .login-title{font-size:24px;}
}
</style>
<link rel="stylesheet" href="light-theme.css">
<link rel="stylesheet" href="/_shared/mobile.css">
<script src="/_shared/theme.js"></script>
</head>
<body>

<div class="page">

  <div class="card">

    <!-- Brand panel -->
    <div class="brand-panel">
      <div class="brand-content">
        <div class="brand-logo">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="32,3 61,17 61,47 32,61 3,47 3,17"
              stroke="rgba(255,255,255,.6)" stroke-width="1.8" fill="rgba(255,255,255,.12)"/>
            <polygon points="32,12 52,22 52,42 32,52 12,42 12,22"
              stroke="rgba(255,255,255,.3)" stroke-width="1" fill="none"/>
            <line x1="19" y1="23" x2="45" y2="23" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
            <line x1="32" y1="23" x2="32" y2="45" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="brand-title" id="lbl-brand">TPKELE<br>CRM</h1>
        <p class="brand-subtitle" id="lbl-tagline">Customer Relationship Management — manage customers, suppliers, products and orders in one place.</p>
      </div>
    </div>

    <!-- Login panel -->
    <div class="login-panel">
      <div class="login-header">
        <h2 class="login-title" id="lbl-signin">Sign In to CRM</h2>
        <p class="login-desc" id="lbl-signin-desc">Enter your credentials to access your workspace</p>
      </div>

      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="field">
          <label for="inp-account" id="lbl-a">Username</label>
          <input type="text" id="inp-account" placeholder="Enter your username" required autocomplete="username"/>
        </div>
        <div class="field">
          <label for="inp-pw" id="lbl-p">Password</label>
          <input type="password" id="inp-pw" placeholder="Enter your password" required autocomplete="current-password"/>
        </div>

        <div class="options-row">
          <div class="remember-wrap">
            <input type="checkbox" id="rememberMe"/>
            <label for="rememberMe" id="lbl-remember">Remember me</label>
          </div>
          <a href="#" class="forgot-link" id="lbl-forgot">Forgot password?</a>
        </div>

        <div class="err" id="errMsg"></div>

        <button type="submit" class="login-btn" id="signBtn">
          <span id="lbl-btn">LOG IN</span>
        </button>
      </form>
    </div>

  </div>

  <div class="bottom-row">
    <select class="lang-select" id="langSel" onchange="setLang(this.value)">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
    <div class="status-bar">
      <span id="s-dot" class="status-offline">offline</span>
      &nbsp;|&nbsp;IP: <span id="s-ip">--</span>
      &nbsp;|&nbsp;MAC: <span id="s-mac">--</span>
    </div>
  </div>

</div>

<script>
/* ── i18n ── */
const T = {
  en: {
    a:'Username', p:'Password', btn:'LOG IN', loading:'Signing in...',
    ef:'Please enter credentials', er:'Invalid account or password',
    signin:'Sign In to CRM', signdesc:'Enter your credentials to access your workspace',
    remember:'Remember me', forgot:'Forgot password?',
    brand:'TPKELE<br>CRM',
    tagline:'Customer Relationship Management — manage customers, suppliers, products and orders in one place.'
  },
  zh: {
    a:'账号', p:'密码', btn:'登 录', loading:'登录中...',
    ef:'请填写账号和密码', er:'账号或密码错误',
    signin:'登录 CRM 系统', signdesc:'请输入账号和密码以进入工作台',
    remember:'记住我', forgot:'忘记密码？',
    brand:'TPKELE<br>CRM',
    tagline:'客户关系管理系统 — 客户、供应商、产品和订单，全部一站式管理。'
  }
};
let cl = localStorage.getItem('crm_lang') || 'en';

function setLang(l) {
  cl = l;
  localStorage.setItem('crm_lang', l);
  document.getElementById('langSel').value = l;
  document.getElementById('lbl-a').textContent = T[l].a;
  document.getElementById('lbl-p').textContent = T[l].p;
  document.getElementById('lbl-btn').textContent = T[l].btn;
  document.getElementById('lbl-signin').textContent = T[l].signin;
  document.getElementById('lbl-signin-desc').textContent = T[l].signdesc;
  document.getElementById('lbl-remember').textContent = T[l].remember;
  document.getElementById('lbl-forgot').textContent = T[l].forgot;
  document.getElementById('lbl-brand').innerHTML = T[l].brand;
  document.getElementById('lbl-tagline').textContent = T[l].tagline;
  document.getElementById('inp-account').placeholder = l === 'zh' ? '请输入账号' : 'Enter your username';
  document.getElementById('inp-pw').placeholder = l === 'zh' ? '请输入密码' : 'Enter your password';
}

async function doLogin(e) {
  e.preventDefault();
  const account = document.getElementById('inp-account').value.trim();
  const pw      = document.getElementById('inp-pw').value;
  const btn     = document.getElementById('signBtn');
  const err     = document.getElementById('errMsg');
  if (!account || !pw) { err.textContent = T[cl].ef; return; }
  err.textContent = '';
  btn.disabled = true;
  document.getElementById('lbl-btn').textContent = T[cl].loading;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: account, password: pw })
    });
    const data = await res.json();
    if (!res.ok || !data.token) throw new Error(data.message || T[cl].er);
    localStorage.setItem('crm_token', data.token);
    if (data.username) localStorage.setItem('crm_username', data.username);
    if (data.user) localStorage.setItem('crm_user', JSON.stringify(data.user));
    location.href = '/dashboard.html';
  } catch (ex) {
    err.textContent = ex.message || T[cl].er;
    btn.disabled = false;
    document.getElementById('lbl-btn').textContent = T[cl].btn;
  }
}

/* ── Status check ── */
async function checkStatus() {
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    if (r.ok) {
      document.getElementById('s-dot').textContent = 'online';
      document.getElementById('s-dot').className = 'status-online';
      const d = await r.json();
      if (d.ip)  document.getElementById('s-ip').textContent  = d.ip;
      if (d.mac) document.getElementById('s-mac').textContent = d.mac;
    }
  } catch {}
}

setLang(cl);
checkStatus();
if (localStorage.getItem('crm_token')) location.href = '/dashboard.html';
</script>
</body>
</html>
