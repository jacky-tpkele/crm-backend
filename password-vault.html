<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2026-05-24b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TPKELE">
<script src="/pwa.js" defer></script>
<script src="/_shared/mobile.js" defer></script>
<title>常用密码存储 - TPKELE CRM</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f7f6;--panel:#ffffff;--panel2:#f9fbfa;--border:#e7ece9;--border-h:#cfe0d6;--text:#111718;--muted:#5f6d68;--muted2:#41514b;--primary:#1a1a1a;--primary-d:#000000;--green:#1a1a1a;--danger:#1a1a1a;--shadow:0 18px 45px rgba(13,34,28,.10)}
html,body{height:100%;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
.header{height:58px;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--border);background:#ffffff;position:sticky;top:0;z-index:10}
.back-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:#ffffff;color:var(--muted2);font-size:13px;transition:.2s}
.back-btn:hover{border-color:var(--primary);background:#eef4f0;color:var(--primary-d)}
.header-title{font-size:16px;font-weight:700}
.header-right{margin-left:auto;display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--primary);background:#eef4f0;color:var(--primary-d)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--primary-d);border-color:var(--primary-d);color:#fff}
.main{max-width:980px;margin:0 auto;padding:22px 18px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.panel-title{font-size:15px;font-weight:700;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted2)}
.field input{background:#ffffff;border:1px solid #d8e0db;border-radius:8px;padding:10px 12px;color:var(--text);outline:none;transition:.2s}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,26,26,.14)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;background:#ffffff;border:1px solid #d8e0db;border-radius:8px;padding:10px 12px;color:var(--text);transition:.2s}
.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,26,26,.14);outline:none}
.count{font-size:12px;color:var(--muted);margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;transition:.2s}
.card:hover{border-color:var(--border-h);box-shadow:var(--shadow)}
.card h4{font-size:14px;margin-bottom:8px}
.meta{font-size:12px;color:var(--muted2);line-height:1.6}
.mask{font-family:monospace;font-size:14px;color:var(--text);margin:8px 0}
.link{color:var(--primary);text-decoration:underline;word-break:break-all}
.link:hover{color:var(--primary-d)}
.toast{position:fixed;bottom:24px;right:24px;padding:10px 14px;border-radius:8px;font-size:12px;display:none;background:#ffffff;border:1px solid var(--border);color:var(--text);box-shadow:var(--shadow)}
.toast.show{display:block}
.toast.ok{border-color:rgba(26,26,26,.35);color:var(--primary)}
.toast.err{border-color:rgba(217,45,32,.35);color:#1a1a1a}
.modal{position:fixed;inset:0;background:rgba(15,31,28,.42);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal.show{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal-box h3{margin-bottom:10px}
.modal-box p{font-size:12px;color:var(--muted);margin-bottom:10px}
.modal-input{width:100%;background:#ffffff;border:1px solid #d8e0db;border-radius:8px;padding:10px 12px;color:var(--text);transition:.2s}
.modal-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,26,26,.14);outline:none}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="light-theme.css">
<link rel="stylesheet" href="/_shared/mobile.css">
<script src="/_shared/theme.js"></script>
</head>
<body>
<div id="toast" class="toast"></div>
<header class="header">
  <a href="dashboard.html" class="back-btn">← 返回</a>
  <div class="header-title">常用密码存储</div>
  <div class="header-right">
    <button class="btn" onclick="openSecurityModal()">安全设置</button>
  </div>
</header>

<div class="main">
  <section class="panel">
    <div class="panel-title">新增密码</div>
    <div class="grid">
      <div class="field"><label>用途名称 *</label><input id="f-name" placeholder="例如：企业微信"></div>
      <div class="field"><label>平台/网站</label><input id="f-platform" placeholder="例如：https://work.weixin.qq.com"></div>
      <div class="field"><label>账号 *</label><input id="f-account" placeholder="例如：admin@xx.com"></div>
      <div class="field"><label>密码 *</label><input id="f-password" type="password" placeholder="请输入密码"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn btn-primary" onclick="createItem()">新增密码</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">查看密码（搜索式）</div>
    <div class="row" style="margin-bottom:12px">
      <input id="searchInput" class="search" placeholder="输入用途/平台/账号关键词" oninput="renderCards()">
      <span id="countLabel" class="count"></span>
    </div>
    <div id="resultCards" class="cards"></div>
  </section>
</div>

<div id="verifyModal" class="modal">
  <div class="modal-box">
    <h3>二次验证</h3>
    <p>请输入二次验证密码后查看明文</p>
    <input id="verifyPassword" class="modal-input" type="password" style="margin-bottom:10px">
    <div class="row" style="justify-content:flex-end">
      <button class="btn" onclick="closeVerifyModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmReveal()">确认</button>
    </div>
  </div>
</div>

<div id="securityModal" class="modal">
  <div class="modal-box">
    <h3>设置二次验证密码</h3>
    <p>首次设置不用填旧密码，修改时需要旧密码</p>
    <input id="oldSecondPassword" class="modal-input" type="password" placeholder="旧二次验证密码（首次可空）" style="margin-bottom:8px">
    <input id="newSecondPassword" class="modal-input" type="password" placeholder="新二次验证密码" style="margin-bottom:10px">
    <div class="row" style="justify-content:flex-end">
      <button class="btn" onclick="closeSecurityModal()">取消</button>
      <button class="btn btn-primary" onclick="saveSecondPassword()">保存</button>
    </div>
  </div>
</div>

<script src="_shared/layout.js"></script>
<script>
const TOKEN = CRM.getToken();
if (!TOKEN) location.href = 'login.html';
let state = { items: [], revealId: null };

const api = CRM.api;

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function toast(msg, type = 'ok') { const el = document.getElementById('toast'); el.className = 'toast show ' + type; el.textContent = msg; setTimeout(() => el.className = 'toast', 2800); }

function normalizePlatform(p) {
  const t = String(p || '').trim();
  if (!t) return '';
  return /^https?:\/\//i.test(t) ? t : ('https://' + t);
}

async function loadItems() {
  state.items = await api('/api/password-vault/items');
  renderCards();
}

function renderCards() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const rows = q ? state.items.filter(i => [i.name, i.platform, i.account].join(' ').toLowerCase().includes(q)) : state.items;
  document.getElementById('countLabel').textContent = `${rows.length} 条`;
  const box = document.getElementById('resultCards');
  if (!rows.length) { box.innerHTML = '<div class="meta">暂无匹配数据</div>'; return; }
  box.innerHTML = rows.map(i => {
    const url = normalizePlatform(i.platform);
    const linkHtml = i.platform ? `<a class="link" href="${esc(url)}" target="_blank">${esc(i.platform)}</a>` : '—';
    return `<div class="card">
      <h4>${esc(i.name)}</h4>
      <div class="meta">账号：${esc(i.account)}</div>
      <div class="meta">平台：${linkHtml}</div>
      <div class="mask">密码：${i.password_masked || '************'}</div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn" onclick="openVerifyModal('${i.id}')">查看密码</button>
      </div>
    </div>`;
  }).join('');
}

async function createItem() {
  const payload = {
    name: document.getElementById('f-name').value.trim(),
    platform: document.getElementById('f-platform').value.trim(),
    account: document.getElementById('f-account').value.trim(),
    password: document.getElementById('f-password').value,
  };
  if (!payload.name || !payload.account || !payload.password) { toast('请填写必填字段', 'err'); return; }
  await api('/api/password-vault/items', { method: 'POST', body: JSON.stringify(payload) });
  document.getElementById('f-name').value = '';
  document.getElementById('f-platform').value = '';
  document.getElementById('f-account').value = '';
  document.getElementById('f-password').value = '';
  toast('保存成功');
  await loadItems();
}

function openVerifyModal(id) { state.revealId = id; document.getElementById('verifyPassword').value = ''; document.getElementById('verifyModal').classList.add('show'); }
function closeVerifyModal() { document.getElementById('verifyModal').classList.remove('show'); }

async function confirmReveal() {
  const secondPassword = document.getElementById('verifyPassword').value;
  if (!secondPassword) { toast('请输入二次验证密码', 'err'); return; }
  try {
    const res = await api('/api/password-vault/items/' + state.revealId + '/reveal', {
      method: 'POST',
      body: JSON.stringify({ secondPassword }),
    });
    closeVerifyModal();
    alert('明文密码：' + res.password + '\n\n将在 ' + (res.visibleSeconds || 15) + ' 秒后自动失效，请谨慎使用。');
  } catch (e) {
    toast(e.message || '二次验证失败', 'err');
  }
}

function openSecurityModal() { document.getElementById('securityModal').classList.add('show'); }
function closeSecurityModal() { document.getElementById('securityModal').classList.remove('show'); }

async function saveSecondPassword() {
  const oldPassword = document.getElementById('oldSecondPassword').value;
  const newPassword = document.getElementById('newSecondPassword').value;
  if (!newPassword || newPassword.length < 4) { toast('新密码至少4位', 'err'); return; }
  await api('/api/password-vault/security/second-password', {
    method: 'POST',
    body: JSON.stringify({ oldPassword, newPassword }),
  });
  document.getElementById('oldSecondPassword').value = '';
  document.getElementById('newSecondPassword').value = '';
  closeSecurityModal();
  toast('二次验证密码已保存');
}

window.addEventListener('click', (e) => {
  if (e.target.id === 'verifyModal') closeVerifyModal();
  if (e.target.id === 'securityModal') closeSecurityModal();
});

loadItems().catch(e => toast(e.message, 'err'));
</script>
</body>
</html>
