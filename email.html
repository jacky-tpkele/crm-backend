<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2026-05-24b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TPKELE">
<script src="/pwa.js" defer></script>
<script src="/_shared/mobile.js" defer></script>
<title>TPKELE CRM - 邮件</title>
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--panel:#ffffff;--panel2:#f7f7f7;
  --border:#e3e3e3;--border-h:#c8c8c8;
  --text:#1a1a1a;--muted:#767676;--muted2:#4a4a4a;
  --primary:#1a1a1a;--primary-dim:#f0f0f0;
  --danger:#1a1a1a;--success:#1a1a1a;
  --shadow:0 4px 16px rgba(0,0,0,.08);--radius:6px;--sb:220px;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px}

.app{display:flex;height:100vh;overflow:hidden}

/* ── Email layout ── */
.email-shell{flex:1;display:flex;overflow:hidden}

/* ── Folder panel ── */
.folder-panel{width:238px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel)}
.folder-header{padding:14px;border-bottom:1px solid var(--border);flex-shrink:0}

/* ── Account tree ── */
.acct-tree{flex:1;overflow-y:auto;padding:6px 0;min-height:0}
.acct-node{margin-bottom:1px}
.acct-head{display:flex;align-items:center;gap:7px;padding:8px 10px 8px 11px;margin:1px 6px;border-radius:6px;cursor:pointer;transition:.15s;color:var(--text);font-size:12.5px;font-weight:600}
.acct-head:hover{background:var(--hover)}
.acct-head.is-current{background:var(--selected)}
.acct-caret{flex-shrink:0;width:11px;font-size:9px;color:var(--muted);transition:transform .18s;line-height:1}
.acct-node.open .acct-caret{transform:rotate(90deg)}
.acct-mail{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-tag{flex-shrink:0;font-size:9px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;line-height:15px}
.acct-edit{flex-shrink:0;width:19px;height:19px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;border-radius:4px;display:none;place-items:center;line-height:1}
.acct-head:hover .acct-edit{display:grid}
.acct-edit:hover{background:var(--border);color:var(--text)}
.acct-sub{display:none;padding:1px 0 5px}
.acct-node.open .acct-sub{display:block}
.sub-item{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 30px;margin:1px 6px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted2);transition:.15s;border-left:3px solid transparent}
.sub-item:hover{background:var(--hover);color:var(--text)}
.sub-item.active{background:var(--selected);color:var(--text);border-left-color:var(--text);font-weight:600}
.sub-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-badge{flex-shrink:0;background:var(--text);color:var(--panel);font-size:9.5px;font-weight:700;border-radius:9px;padding:1px 5px;min-width:17px;text-align:center}
.sub-sync{flex-shrink:0;width:19px;height:19px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;border-radius:4px;display:none;place-items:center;line-height:1}
.sub-item:hover .sub-sync{display:grid}
.sub-sync:hover{background:var(--border);color:var(--text)}
.sub-sync.spin{display:grid;animation:subspin .9s linear infinite}
@keyframes subspin{to{transform:rotate(360deg)}}
.acct-tree-empty{padding:18px 14px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
.tree-sep{height:1px;background:var(--border);margin:6px 12px}
.btn-add-acct{display:flex;align-items:center;gap:7px;width:calc(100% - 12px);margin:2px 6px;padding:7px 11px;border-radius:6px;border:1px dashed var(--border-h);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:.15s;text-align:left}
.btn-add-acct:hover{border-color:var(--text);color:var(--text)}
.folder-foot{padding:9px 8px;border-top:1px solid var(--border);flex-shrink:0}
.btn-back-crm{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:7px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:12px;cursor:pointer;transition:.15s}
.btn-back-crm:hover{border-color:var(--text);color:var(--text)}
.btn-compose{width:100%;padding:9px 14px;border-radius:8px;border:none;background:var(--text);color:var(--panel);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn-compose:hover{opacity:.85}


/* ── Email list ── */
.list-panel{width:300px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel)}
.list-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.list-title{font-size:14px;font-weight:600}
.list-count{font-size:11px;color:var(--muted)}
.list-body{flex:1;overflow-y:auto}
.email-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s}
.email-item:hover{background:var(--hover)}
.email-item.active{background:var(--selected);border-left:3px solid var(--text)}
.email-item.unread .ei-subject{font-weight:600;color:var(--text)}
.email-item.unread .ei-from{color:var(--text)}
.ei-from{font-size:12.5px;font-weight:500;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei-subject{font-size:12.5px;color:var(--muted2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei-date{font-size:11px;color:var(--muted);margin-top:4px}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--text);display:inline-block;margin-right:6px;flex-shrink:0}
.ei-row{display:flex;align-items:center}
.list-empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px}
.list-loading{padding:30px;text-align:center;color:var(--muted);font-size:13px}

/* ── Detail / Compose ── */
.detail-panel{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0}
.detail-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px}
.detail-placeholder svg{opacity:.25}

.reader{flex:1;display:flex;flex-direction:column;overflow:hidden}
.reader-header{padding:18px 24px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.reader-subject{font-size:18px;font-weight:600;margin-bottom:10px}
.reader-meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;color:var(--muted2)}
.reader-meta strong{color:var(--text)}
.reader-actions{display:flex;gap:8px;margin-top:14px}
.btn-action{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.2s}
.btn-action:hover{border-color:var(--text);color:var(--text)}
.btn-action.danger:hover{border-color:var(--text);color:var(--text)}
.reader-body{flex:1;overflow-y:auto;padding:20px 24px}
.reader-body.collapsed{max-height:500px;overflow:hidden;position:relative}
.reader-html{color:var(--text);font-size:14px;line-height:1.7;max-width:720px}
.reader-html a{color:var(--text)}
.reader-html img{max-width:100%}
.reader-text{white-space:pre-wrap;font-size:13.5px;line-height:1.8;color:var(--muted2);max-width:720px}

.compose{flex:1;display:flex;flex-direction:column;overflow:hidden}
.compose-header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.compose-title{font-size:14px;font-weight:600}
.btn-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted2);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.15s}
.btn-close:hover{border-color:var(--text);color:var(--text)}
.compose-form{flex:1;display:flex;flex-direction:column;padding:16px 24px;gap:10px;overflow-y:auto}
.field-row{display:flex;align-items:center;border-bottom:1px solid var(--border);padding-bottom:8px}
.field-label{font-size:12px;color:var(--muted);width:50px;flex-shrink:0}
.field-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13.5px;padding:2px 0}
.field-input::placeholder{color:var(--muted)}
.compose-editor{flex:1;display:flex;flex-direction:column;min-height:0}
.compose-footer{padding:12px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn-send{padding:8px 22px;border-radius:7px;border:none;background:var(--text);color:var(--panel);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s}
.btn-send:hover{opacity:.85}
.sig-hint{margin-left:auto;font-size:11.5px;color:var(--muted);flex-shrink:0}
.btn-send:disabled{opacity:.5;pointer-events:none}
.btn-draft{padding:8px 16px;border-radius:7px;border:1px solid var(--border-h);background:transparent;color:var(--muted2);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s}
.btn-draft:hover{border-color:var(--text);color:var(--text)}
.btn-draft:disabled{opacity:.45;pointer-events:none}
.send-status{font-size:12px;color:var(--muted)}
.send-status.ok{color:var(--text)}
.send-status.err{color:var(--text)}

.attach-area{border:1px dashed var(--border);border-radius:8px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:40px;flex-shrink:0}
.attach-btn{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted2);cursor:pointer;font-size:12px;transition:.2s;flex-shrink:0}
.attach-btn:hover{border-color:var(--text);color:var(--text)}
.table-tools{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0;flex-shrink:0}
.table-tool-btn{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--muted2);cursor:pointer;font-size:12px;transition:.2s}
.table-tool-btn:hover{border-color:var(--text);color:var(--text);background:var(--hover)}
.attach-chip{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--muted2)}
.attach-chip .rm{cursor:pointer;color:var(--muted);font-size:14px;line-height:1;transition:.15s}
.attach-chip .rm:hover{color:var(--text)}

/* ── Quill dark theme ── */
.ql-toolbar.ql-snow{background:var(--panel2);border-color:var(--border)!important;border-radius:8px 8px 0 0;flex-shrink:0}
.ql-container.ql-snow{border-color:var(--border)!important;border-radius:0 0 8px 8px;color:#111;flex:1;min-height:160px;display:flex;flex-direction:column;background:#fff}
.ql-editor{flex:1;color:#111;background:#fff;font-size:13.5px;line-height:1.8}
.ql-editor.ql-blank::before{color:#8b96a3;font-style:normal}
.ql-snow .ql-stroke{stroke:var(--muted2)}
.ql-snow .ql-fill{fill:var(--muted2)}
.ql-snow .ql-picker{color:var(--muted2)}
.ql-snow .ql-picker-options{background:var(--panel2);border-color:var(--border)!important}
.ql-snow .ql-picker-item{color:var(--text)}
.ql-snow .ql-toolbar button:hover .ql-stroke,.ql-snow .ql-toolbar button.ql-active .ql-stroke{stroke:var(--text)}
.ql-snow .ql-toolbar button:hover .ql-fill,.ql-snow .ql-toolbar button.ql-active .ql-fill{fill:var(--text)}
.ql-snow .ql-toolbar button:hover,.ql-snow .ql-toolbar button.ql-active{color:var(--text)}
.ql-snow .ql-picker-label:hover,.ql-snow .ql-picker.ql-expanded .ql-picker-label{color:var(--text)!important}
.ql-snow .ql-picker.ql-expanded .ql-picker-label .ql-stroke{stroke:var(--text)!important}
.ql-editor a{color:var(--text)}

/* ── Account Modal ── */
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;place-items:center}
.modal-overlay.open{display:grid}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:520px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:15px;font-weight:600}
.modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.form-row{display:grid;grid-template-columns:1fr 90px;gap:10px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:11.5px;color:var(--muted2)}
.form-label .req{color:var(--danger)}
.form-ctrl{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;transition:.15s;width:100%}
.form-ctrl:focus{border-color:var(--text)}
.form-ctrl::placeholder{color:var(--muted)}
.form-hint{font-size:11px;color:var(--muted);margin-top:2px}
.btn-modal-cancel{padding:7px 18px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted2);cursor:pointer;font-size:13px;transition:.15s}
.btn-modal-cancel:hover{border-color:var(--border-h);color:var(--text)}
.btn-modal-save{padding:7px 22px;border-radius:7px;border:none;background:var(--text);color:var(--panel);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn-modal-save:hover{opacity:.85}
.btn-modal-delete{padding:7px 16px;border-radius:7px;border:1px solid var(--text);background:transparent;color:var(--text);cursor:pointer;font-size:13px;margin-right:auto;transition:.15s}
.btn-modal-delete:hover{background:var(--hover)}
.modal-status{font-size:12px;margin-left:4px}
.modal-status.err{color:var(--text)}
.modal-status.ok{color:var(--text)}

/* ── Multi-select ── */
.bulk-bar{display:none;align-items:center;gap:10px;padding:8px 16px;background:rgba(11,155,63,.07);border-bottom:1px solid var(--border);flex-shrink:0}
.bulk-bar.show{display:flex}
.bulk-count{font-size:12px;color:var(--primary);font-weight:600}
.btn-bulk-del{padding:4px 12px;border-radius:6px;border:1px solid rgba(251,113,133,.4);background:rgba(251,113,133,.08);color:var(--danger);font-size:12px;cursor:pointer;transition:.2s}
.btn-bulk-del:hover{background:rgba(251,113,133,.2)}
.btn-bulk-cancel{margin-left:auto;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:12px;cursor:pointer;transition:.2s}
.btn-bulk-cancel:hover{color:var(--text)}
.sel-all-wrap{display:flex;align-items:center}
.sel-all-check{width:14px;height:14px;cursor:pointer;accent-color:var(--primary);flex-shrink:0}
.ei-check{width:14px;height:14px;flex-shrink:0;cursor:pointer;accent-color:var(--primary);opacity:0;transition:opacity .15s;margin-right:2px}
.email-item:hover .ei-check,.email-item.selected .ei-check{opacity:1}
.email-item.selected{background:rgba(11,155,63,.06)}

/* ── Fullscreen compose ── */
.detail-panel.fullscreen{position:fixed;inset:0;z-index:200}
.btn-fs{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted2);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.15s;flex-shrink:0}
.btn-fs:hover{border-color:rgba(11,155,63,.4);color:var(--primary)}

/* ── Table insert dialog ── */
.tbl-dlg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:500;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow);display:none;flex-direction:column;gap:14px;min-width:220px}
.tbl-dlg.open{display:flex}
.tbl-dlg-title{font-size:14px;font-weight:600}
.tbl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted2)}
.tbl-num{width:70px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:15px;outline:none;text-align:center;font-weight:600}
.tbl-num:focus{border-color:var(--primary)}
.tbl-dlg-btns{display:flex;gap:8px;justify-content:flex-end}
.btn-tbl-ok{padding:6px 18px;border-radius:7px;border:none;background:var(--primary);color:#000;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn-tbl-ok:hover{background:#00e5ff}
.btn-tbl-cancel{padding:6px 14px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:13px;cursor:pointer;transition:.15s}
.btn-tbl-cancel:hover{color:var(--text)}
.tbl-dlg-overlay{position:fixed;inset:0;z-index:499;display:none}
.tbl-dlg-overlay.open{display:block}

/* ── Table styles in editor & reader ── */
.reader-html table,.ql-editor table{border-collapse:collapse;width:auto;margin:10px 0;font-size:13px;border:1px solid #222}
.reader-html th,.reader-html td,.ql-editor th,.ql-editor td{border:1px solid #222;padding:8px 12px;min-width:80px;vertical-align:top}
.reader-html td,.ql-editor td{background:#fff;color:#111}
.reader-html th,.ql-editor th{background:#f1f3f5;font-weight:700;color:#111}
.ql-editor td p,.ql-editor th p{margin:0}
.ql-editor table.is-striped tbody tr:nth-child(even) td{background:#f7f7f7}
.ql-editor table.active-table{outline:2px solid rgba(11,155,63,.35);outline-offset:2px}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--text);display:none;align-items:center;gap:10px;box-shadow:var(--shadow)}
.toast.show{display:flex}
.toast.ok{border-color:rgba(74,222,128,.35)}
.toast.err{border-color:rgba(251,113,133,.35)}

/* ── 简洁白底邮件风格（Reader + Compose 共享） ── */
.detail-panel{background:#ffffff !important;color:#111827}
.detail-placeholder{background:#ffffff;color:#94a3b8}

/* Reader（查看邮件） */
.reader{background:#ffffff;min-height:0}
.reader-header{padding:22px 28px 16px;background:#ffffff !important;border-bottom:1px solid #e5e7eb !important}
.reader-subject{font-size:20px;font-weight:600;color:#111827 !important;margin-bottom:12px}
.reader-meta{font-size:13px;color:#4b5563 !important;gap:6px 24px}
.reader-meta strong{color:#111827 !important;font-weight:600}
.reader-actions{margin-top:16px;gap:10px}
.btn-action{padding:7px 16px !important;border:1px solid #d1d5db !important;background:#ffffff !important;color:#374151 !important;border-radius:8px !important;font-size:13px !important;cursor:pointer;transition:.15s}
.btn-action:hover{background:#f9fafb !important;border-color:#9ca3af !important;color:#111827 !important}
.btn-action.danger{border-color:#fca5a5 !important;color:#dc2626 !important}
.btn-action.danger:hover{background:#fef2f2 !important;border-color:#dc2626 !important;color:#b91c1c !important}
.reader-body{padding:0 !important;background:#ffffff !important;overflow-y:auto !important;min-height:0;-webkit-overflow-scrolling:touch}
.reader-body.collapsed{max-height:none !important;overflow-y:auto !important}
.reader-html{color:#1f2937 !important;font-size:14px;line-height:1.75;max-width:880px}
.reader-html a{color:#2563eb !important}
.reader-text{color:#1f2937 !important;font-size:13.5px;line-height:1.8;max-width:880px}
.reader-frame{width:100%;border:none;background:#ffffff;display:block;min-height:400px}

/* Compose（写邮件）— 简洁白底 */
.compose{background:#ffffff !important;border:none}
.compose-header{padding:14px 22px !important;background:#ffffff !important;border-bottom:1px solid #e5e7eb !important}
.compose-title{font-size:16px !important;font-weight:600 !important;color:#111827 !important}
.btn-close,.btn-fs{border:1px solid #d1d5db !important;background:#ffffff !important;color:#4b5563 !important;border-radius:7px !important}

<script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.6/tinymce.min.js" referrerpolicy="origin"></script>
<script src="https://cdn.jsdelivr.net/npm/tinymce-i18n@24.4.21/langs6/zh_CN.js" referrerpolicy="origin"></script>
<script>
const API = '';
let token = localStorage.getItem('crm_token');
if (!token) location.href = 'login.html';

let currentFolder    = 'INBOX';
let currentEmailId   = null;
let currentEmailData = null; // 当前查看的邮件对象（回复/转发/删除按钮用）
let currentAccountId = null; // null = 使用环境变量默认账号
let mailEditor       = null;
let attachments      = [];
let editingAccountId = null;
let editingDraftId   = null; // 当前写信界面对应的草稿 id（新写信为 null）
// URL 参数 ?customer_id=xxx 时按客户过滤
let filterCustomerId = (new URLSearchParams(location.search)).get('customer_id') || null;
let filterCustomerName = (new URLSearchParams(location.search)).get('customer_name') || '';

// ── Auth fetch ──
async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers||{}) },
    body: opts.body ? (typeof opts.body === 'string' ? opts.body : JSON.stringify(opts.body)) : undefined,
  });
  if (res.status === 401) { localStorage.removeItem('crm_token'); location.href = 'login.html'; }
  return res;
}

// ── Toast ──
function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = (type==='ok'?'✓ ':'✗ ') + msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 3000);
}

// ── Date format ──
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
  if ((now - d) / 86400000 < 7) return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Accounts ──
let accountList = [];  // 已加载的账号，供编辑弹窗复用

// 展开状态：Set<accountId>；'__all__' 代表「全部账号」节点
let openAccts = new Set();

async function loadAccounts() {
  const tree = document.getElementById('acctTree');
  try {
    const res  = await apiFetch('/api/email-accounts');
    const list = await res.json();
    if (!res.ok || !Array.isArray(list)) {
      const msg = (list && list.message) || `HTTP ${res.status}`;
      tree.innerHTML = `<div class="acct-tree-empty">账号加载失败<br>${esc(msg)}</div>`;
      showToast('账号加载失败：' + msg, 'err');
      return;
    }
    accountList = list;
    // 首次加载：默认展开当前账号，没有则展开第一个
    if (!openAccts.size) {
      if (currentAccountId) openAccts.add(currentAccountId);
      else if (list.length) openAccts.add(list[0].id);
    }
    renderAcctTree();
  } catch (e) {
    tree.innerHTML = `<div class="acct-tree-empty">账号加载失败<br>${esc(e.message)}</div>`;
    showToast('账号加载失败：' + e.message, 'err');
  }
}

const SUB_FOLDERS = [
  { key:'INBOX', label:'收件箱', sync:true },
  { key:'SENT',  label:'已发送' },
  { key:'DRAFT', label:'草稿'   },
];

function renderAcctTree() {
  const tree = document.getElementById('acctTree');
  // 当前选中的账号如果已被删除，回落到「全部」
  if (currentAccountId && !accountList.some(a => a.id === currentAccountId)) currentAccountId = null;

  const nodeHtml = (id, mailLabel, tag, editIdx) => {
    const isOpen    = openAccts.has(id ?? '__all__');
    const isCurrent = (id ?? null) === currentAccountId;
    const subs = SUB_FOLDERS.map(f => {
      const active = isCurrent && currentFolder === f.key;
      const badge  = f.key === 'INBOX'
        ? `<span class="sub-badge" id="badge-inbox-${id ?? 'all'}" style="display:none"></span>` : '';
      const sync   = f.sync
        ? `<button class="sub-sync" title="同步收件箱" onclick="event.stopPropagation();syncAccount(${id ? `'${id}'` : 'null'},this)">⟳</button>` : '';
      return `<div class="sub-item ${active ? 'active' : ''}" onclick="selectAcctFolder(${id ? `'${id}'` : 'null'},'${f.key}')">
        <span class="sub-label">${f.label}</span>${badge}${sync}</div>`;
    }).join('');
    const editBtn = editIdx !== null
      ? `<button class="acct-edit" title="编辑账号" onclick="event.stopPropagation();editAcct(${editIdx})">✎</button>` : '';
    return `<div class="acct-node ${isOpen ? 'open' : ''}" data-acct="${id ?? '__all__'}">
      <div class="acct-head ${isCurrent ? 'is-current' : ''}" onclick="toggleAcct('${id ?? '__all__'}')">
        <span class="acct-caret">▶</span>
        <span class="acct-mail" title="${esc(mailLabel)}">${esc(mailLabel)}</span>
        ${tag ? `<span class="acct-tag">${tag}</span>` : ''}${editBtn}
      </div>
      <div class="acct-sub">${subs}</div>
    </div>`;
  };

  let html = '';
  accountList.forEach((a, i) => {
    html += nodeHtml(a.id, a.email || a.display_name || '未命名', i === 0 ? '默认' : '', i);
  });
  if (accountList.length > 1) html += nodeHtml(null, '全部账号', '', null);
  if (!accountList.length) html = '<div class="acct-tree-empty">暂无邮箱账号<br>点下面「添加邮箱账号」</div>';

  html += `<div class="tree-sep"></div>
    <div class="sub-item ${currentFolder === 'INQUIRY' ? 'active' : ''}" style="padding-left:16px" onclick="selectInquiry(this)">
      <span class="sub-label">网站询盘</span>
      <span class="sub-badge" id="badge-inquiry" style="display:none"></span>
    </div>
    <div class="tree-sep"></div>
    <button class="btn-add-acct" onclick="openAccountModal()">＋ 添加邮箱账号</button>`;

  tree.innerHTML = html;
  refreshInquiryBadge();
}

function editAcct(idx) {
  const a = accountList[idx];
  if (a) openAccountModal(JSON.stringify(a));
}

// 点账号标题：展开/收起（不切换当前文件夹）
function toggleAcct(id) {
  if (openAccts.has(id)) openAccts.delete(id); else openAccts.add(id);
  const node = document.querySelector(`.acct-node[data-acct="${id}"]`);
  if (node) node.classList.toggle('open', openAccts.has(id));
}

// 点子文件夹：同时切账号 + 切文件夹
function selectAcctFolder(acctId, folder) {
  currentAccountId = acctId || null;
  currentFolder    = folder;
  currentEmailId   = null;
  openAccts.add(acctId ?? '__all__');

  document.querySelectorAll('.sub-item').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.acct-head').forEach(x => x.classList.remove('is-current'));
  const node = document.querySelector(`.acct-node[data-acct="${acctId ?? '__all__'}"]`);
  if (node) {
    node.classList.add('open');
    node.querySelector('.acct-head')?.classList.add('is-current');
    const idx = SUB_FOLDERS.findIndex(f => f.key === folder);
    node.querySelectorAll('.sub-item')[idx]?.classList.add('active');
  }

  const acct = accountList.find(a => a.id === acctId);
  const fLabel = SUB_FOLDERS.find(f => f.key === folder)?.label || folder;
  document.getElementById('listTitle').textContent =
    acct ? `${fLabel}` : `${fLabel} · 全部账号`;

  if (window.innerWidth <= 768) document.body.classList.remove('email-view-folders', 'email-view-detail');
  showPlaceholder();
  loadEmails(folder);
}

function selectInquiry(el) {
  currentFolder  = 'INQUIRY';
  currentEmailId = null;
  document.querySelectorAll('.sub-item').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.acct-head').forEach(x => x.classList.remove('is-current'));
  if (el) el.classList.add('active');
  document.getElementById('listTitle').textContent = '网站询盘';
  if (window.innerWidth <= 768) document.body.classList.remove('email-view-folders', 'email-view-detail');
  showPlaceholder();
  loadEmails('INQUIRY');
}

// ── Account Modal ──
function openAccountModal(accountJson = null) {
  const a = accountJson ? JSON.parse(accountJson) : null;
  editingAccountId = a?.id || null;
  document.getElementById('modalTitle').textContent = a ? '编辑邮箱' : '添加邮箱';
  document.getElementById('fDisplayName').value = a?.display_name || '';
  document.getElementById('fEmail').value        = a?.email || '';
  document.getElementById('fFromName').value     = a?.from_name || '';
  document.getElementById('fImapHost').value     = a?.imap_host || '';
  document.getElementById('fImapPort').value     = a?.imap_port || '993';
  document.getElementById('fSmtpHost').value     = a?.smtp_host || '';
  document.getElementById('fSmtpPort').value     = a?.smtp_port || '465';
  document.getElementById('fUsername').value     = a?.username || '';
  document.getElementById('fPassword').value     = '';
  document.getElementById('fPassword').placeholder = a ? '不修改则留空' : '邮箱密码';
  document.getElementById('passReq').style.display  = a ? 'none' : '';
  document.getElementById('passHint').style.display  = a ? '' : 'none';
  // 默认账号（列表第一个）由环境变量自动创建，删掉会被重新建出来，直接隐藏删除按钮
  const isDefault = !!a && accountList.length > 0 && accountList[0].id === a.id;
  const btnDel = document.getElementById('btnDeleteAccount');

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingAccountId = null;
}

async function saveAccount() {
  const display_name = document.getElementById('fDisplayName').value.trim();
  const email        = document.getElementById('fEmail').value.trim();
  const from_name    = document.getElementById('fFromName').value.trim();
  const imap_host    = document.getElementById('fImapHost').value.trim();
  const imap_port    = parseInt(document.getElementById('fImapPort').value) || 993;
  const smtp_host    = document.getElementById('fSmtpHost').value.trim();
  const smtp_port    = parseInt(document.getElementById('fSmtpPort').value) || 465;
  const username     = document.getElementById('fUsername').value.trim() || email;
  const password     = document.getElementById('fPassword').value;
  const statusEl     = document.getElementById('modalStatus');

  if (!display_name || !email || !imap_host || !smtp_host) {
    statusEl.textContent = '请填写带 * 的必填项'; statusEl.className = 'modal-status err'; return;
  }
  if (!editingAccountId && !password) {
    statusEl.textContent = '请输入邮箱密码'; statusEl.className = 'modal-status err'; return;
  }

  const data = { display_name, email, from_name, imap_host, imap_port, smtp_host, smtp_port, username, is_active: true };
  if (password) data.password = password;

  statusEl.textContent = '保存中…'; statusEl.className = 'modal-status';

  try {
    const url    = editingAccountId ? `/api/email-accounts/${editingAccountId}` : '/api/email-accounts';
    const method = editingAccountId ? 'PUT' : 'POST';
    const res    = await apiFetch(url, { method, body: JSON.stringify(data) });
    const result = await res.json();
    if (result.success || result.data) {
      const isNew = !editingAccountId;
      const newId = result.data?.id || null;
      showToast(isNew ? '邮箱已添加' : '邮箱已更新');
      closeModal();
      // 新增后自动切到这个账号并展开，省一步手动切换
      if (isNew && newId) { currentAccountId = newId; openAccts.add(newId); }
      await loadAccounts();
      if (isNew && newId) loadEmails(currentFolder);
    } else {
      statusEl.textContent = result.message || '保存失败'; statusEl.className = 'modal-status err';
    }
  } catch (e) {
    statusEl.textContent = '失败：' + e.message; statusEl.className = 'modal-status err';
  }
}

async function confirmDeleteAccount() {
  if (!confirm('确定删除这个邮箱账号吗？该账号下的邮件记录不会被删除。')) return;
  try {
    await apiFetch(`/api/email-accounts/${editingAccountId}`, { method: 'DELETE' });
    showToast('账号已删除');
    const wasCurrent = currentAccountId === editingAccountId;
    if (wasCurrent) currentAccountId = null;
    openAccts.delete(editingAccountId);
    closeModal();
    await loadAccounts();
    if (wasCurrent) loadEmails(currentFolder);
  } catch (e) { showToast('删除失败：' + e.message, 'err'); }
}

// ── Email list ──
async function loadEmails(folder) {
  const list = document.getElementById('emailList');
  list.innerHTML = '<div class="list-loading">加载中…</div>';
  selectedIds.clear();
  document.getElementById('bulkBar')?.classList.remove('show');
  const selAll = document.getElementById('selAllCheck');
  if (selAll) { selAll.checked = false; selAll.indeterminate = false; }
  try {
    let url;
    if (filterCustomerId) {
      url = `/api/customers/${filterCustomerId}/emails?limit=100`;
    } else {
      const acct = currentAccountId ? `&account_id=${currentAccountId}` : '';
      url = `/api/emails?folder=${folder}${acct}`;
    }
    const res   = await apiFetch(url);
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.message || `HTTP ${res.status}`); }
    const emails = await res.json();
    const list2 = Array.isArray(emails) ? emails : [];
    renderList(list2);
    const countEl = document.getElementById('listCount');
    if (countEl) {
      countEl.textContent = list2.length ? `${list2.length} 封${filterCustomerId ? ' · 客户邮件' : ''}` : (filterCustomerId ? '该客户暂无邮件' : '');
    }
    if (folder === 'INBOX' && !filterCustomerId) updateBadge(list2);
    if (folder === 'INQUIRY') {
      const unread = list2.filter(e => !e.is_read).length;
      const b = document.getElementById('badge-inquiry');
      if (b) { b.textContent = unread; b.style.display = unread ? '' : 'none'; }
    }
  } catch (e) {
    list.innerHTML = `<div class="list-empty">加载失败：${e.message}</div>`;
  }
}

function updateBadge(emails) {
  const unread = emails.filter(e => !e.is_read).length;
  const b = document.getElementById(`badge-inbox-${currentAccountId || 'all'}`);
  if (b) { b.textContent = unread; b.style.display = unread ? '' : 'none'; }
}

// 后台拉取询盘未读数（用于侧边栏徽标，独立于当前列表）
async function refreshInquiryBadge() {
  try {
    const res = await apiFetch('/api/emails?folder=INQUIRY');
    if (!res.ok) return;
    const list = await res.json();
    const unread = (Array.isArray(list) ? list : []).filter(e => !e.is_read).length;
    const b = document.getElementById('badge-inquiry');
    if (b) { b.textContent = unread; b.style.display = unread ? '' : 'none'; }
  } catch (_) {}
}

let selectedIds = new Set();

function renderList(emails) {
  const list = document.getElementById('emailList');
  if (!emails.length) { list.innerHTML = '<div class="list-empty">暂无邮件</div>'; return; }
  list.innerHTML = emails.map(e => `
    <div class="email-item ${e.is_read?'':'unread'} ${e.id===currentEmailId?'active':''} ${selectedIds.has(e.id)?'selected':''}"
         data-id="${e.id}" onclick="handleItemClick(event,'${e.id}',this)">
      <div class="ei-row">
        <input type="checkbox" class="ei-check" data-id="${e.id}"
               ${selectedIds.has(e.id)?'checked':''} onchange="toggleEmailSelect('${e.id}',this)" onclick="event.stopPropagation()">
        ${!e.is_read?'<span class="unread-dot"></span>':''}
        <div class="ei-from" style="flex:1">${esc(e.from_name||e.from_address)}${e.customer_id?'<span style="margin-left:6px;padding:1px 6px;background:rgba(11,155,63,.12);color:#0b9b3f;border:1px solid rgba(11,155,63,.3);border-radius:8px;font-size:10.5px">客户</span>':''}</div>
      </div>
      <div class="ei-subject">${esc(e.subject)}</div>
      <div class="ei-date">${fmtDate(e.received_at)}</div>
    </div>
  `).join('');
}

function handleItemClick(event, id, el) {
  if (event.target.type === 'checkbox') return;
  openEmail(id, el);
}

function toggleEmailSelect(id, checkbox) {
  if (checkbox.checked) selectedIds.add(id);
  else selectedIds.delete(id);
  const item = document.querySelector(`.email-item[data-id="${id}"]`);
  if (item) item.classList.toggle('selected', checkbox.checked);
  updateBulkBar();
}

function toggleSelectAll() {
  const checked = document.getElementById('selAllCheck').checked;
  document.querySelectorAll('.ei-check').forEach(cb => {
    const id = cb.dataset.id;
    cb.checked = checked;
    checked ? selectedIds.add(id) : selectedIds.delete(id);
    const item = document.querySelector(`.email-item[data-id="${id}"]`);
    if (item) item.classList.toggle('selected', checked);
  });
  updateBulkBar();
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const n = selectedIds.size;
  if (n > 0) {
    bar.classList.add('show');
    document.getElementById('bulkCount').textContent = `已选 ${n} 封`;
  } else {
    bar.classList.remove('show');
  }
  const allBoxes = document.querySelectorAll('.ei-check');
  const selAll = document.getElementById('selAllCheck');
  if (selAll && allBoxes.length) {
    selAll.indeterminate = n > 0 && n < allBoxes.length;
    selAll.checked = n === allBoxes.length;
  }
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.ei-check').forEach(cb => { cb.checked = false; });
  document.querySelectorAll('.email-item.selected').forEach(el => el.classList.remove('selected'));
  const selAll = document.getElementById('selAllCheck');
  if (selAll) { selAll.checked = false; selAll.indeterminate = false; }
  document.getElementById('bulkBar').classList.remove('show');
}

async function bulkDelete() {
  const ids = [...selectedIds];
  if (!ids.length) return;
  if (!confirm(`确定删除选中的 ${ids.length} 封邮件吗？`)) return;
  try {
    await Promise.all(ids.map(id => apiFetch(`/api/emails/${id}`, { method: 'DELETE' })));
    showToast(`已删除 ${ids.length} 封邮件`);
    selectedIds.clear();
    if (ids.includes(currentEmailId)) { currentEmailId = null; showPlaceholder(); }
    loadEmails(currentFolder);
  } catch (e) { showToast('删除失败：' + e.message, 'err'); }
}

// ── Open email ──
async function openEmail(id, el) {
  currentEmailId = id;
  document.querySelectorAll('.email-item').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');
  if (window.innerWidth <= 768) {
    document.body.classList.add('email-view-detail');
    document.body.classList.remove('email-view-folders');
  }
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">加载中…</div>';
  try {
    const res   = await apiFetch(`/api/emails/${id}`);
    const email = await res.json();
    currentEmailData = email;

    // 草稿：直接回到编辑界面
    if (email.folder === 'DRAFT') {
      openCompose({
        draftId: email.id,
        to:      email.to_addresses || '',
        cc:      email.cc           || '',
        subject: email.subject      || '',
        body:    email.body_html    || email.body_text || '',
        title:   '编辑草稿',
      });
      return;
    }

    if (!email.is_read) {
      apiFetch(`/api/emails/${id}/read`, { method:'PATCH', body: JSON.stringify({ is_read:true }) });
      el?.classList.remove('unread');
      el?.querySelector('.unread-dot')?.remove();
    }
    panel.innerHTML = `
      <div class="reader">
        <div class="reader-header">
          <div class="reader-subject">${esc(email.subject)}</div>
          <div class="reader-meta">
            <div><strong>发件人：</strong>${esc(email.from_name ? `${email.from_name} <${email.from_address}>` : email.from_address)}</div>
            <div><strong>收件人：</strong>${esc(email.to_addresses)}</div>
            ${email.cc?`<div><strong>抄送：</strong>${esc(email.cc)}</div>`:''}
            <div><strong>时间：</strong>${new Date(email.received_at).toLocaleString('zh-CN')}</div>
          </div>
          <div class="reader-actions">
            <button class="btn-action" onclick="toggleReaderFullscreen()" id="btnReaderFs">⛶ 全屏</button>
            <button class="btn-action" onclick="replyCurrent()">↩ 回复</button>
            <button class="btn-action" onclick="forwardCurrent()">⤷ 转发</button>
            <button class="btn-action danger" onclick="deleteCurrent()">🗑 删除</button>
          </div>
        </div>
        <div class="reader-body" id="readerBody">
          ${email.body_html
            ? `<iframe class="reader-frame" id="readerFrame" sandbox="allow-same-origin allow-popups"></iframe>`
            : `<div class="reader-text" style="padding:24px 28px">${esc(email.body_text||'（无内容）')}</div>`}
        </div>
      </div>`;
    if (email.body_html) renderHtmlBodyInIframe(email.body_html);

  } catch (e) {
    panel.innerHTML = `<div style="padding:24px;color:var(--danger)">加载失败：${e.message}</div>`;
  }
}

function sanitizeHtml(html) {
  return html.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<iframe[\s\S]*?<\/iframe>/gi,'')
    .replace(/on\w+="[^"]*"/gi,'').replace(/on\w+='[^']*'/gi,'');
}

// 把邮件正文渲染到 iframe 里，彻底隔离对方的 CSS（避免暗色背景/绿色 hover 漏到 CRM 主界面）
function renderHtmlBodyInIframe(html) {
  const frame = document.getElementById('readerFrame');
  if (!frame) return;
  const safe = sanitizeHtml(html || '');
  const doc = `<!doctype html><html><head><meta charset="utf-8"><base target="_blank">
<style>
  html,body{margin:0;padding:20px 28px;background:#ffffff;color:#1f2937;font-family:-apple-system,Segoe UI,"Microsoft YaHei",sans-serif;font-size:14px;line-height:1.75;word-wrap:break-word}
  a{color:#2563eb}
  img{max-width:100%;height:auto}
  table{max-width:100%}
</style></head><body>${safe}</body></html>`;
  frame.srcdoc = doc;
  frame.onload = () => {
    try {
      const inner = frame.contentDocument;
      if (!inner) return;
      const resize = () => {
        const h = Math.max(inner.documentElement.scrollHeight, inner.body.scrollHeight, 400);
        frame.style.height = (h + 20) + 'px';
      };
      resize();
      // 图片加载完再调整一次高度
      inner.querySelectorAll('img').forEach(img => { img.addEventListener('load', resize); img.addEventListener('error', resize); });
    } catch(_) {}
  };
}

// ── Sync ──
async function syncAccount(acctId, btn) {
  // acctId: string | null（null = 当前账号）
  const targetId = acctId !== undefined ? acctId : currentAccountId;
  const orig = btn.textContent;
  btn.classList.add('spin');
  try {
    const res  = await apiFetch('/api/emails/sync', { method:'POST', body: JSON.stringify({ account_id: targetId }) });
    const data = await res.json();
    if (data.success) {
      if (data.errors && data.errors.length) {
        showToast(`取到 ${data.fetched} 封，入库失败 ${data.errors.length} 封：${data.errors[0].error}`, 'err');
      } else {
        showToast(`同步完成，新增 ${data.synced} 封`);
      }
      if (currentFolder === 'INBOX') loadEmails(currentFolder);
    } else showToast(data.message || '同步失败', 'err');
  } catch (e) { showToast('同步失败：' + e.message, 'err'); }
  finally { btn.classList.remove('spin'); btn.textContent = orig; }
}

// 旧 syncEmails() 兼容（其它页面/URL 参数可能引用）
async function syncEmails() {
  const dummy = document.createElement('button');
  await syncAccount(currentAccountId, dummy);
}

      <div class="compose-header">
        <span class="compose-title">✏️ ${opts.title||'写邮件'}</span>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn-fs" id="btnFullscreen" onclick="toggleComposeFullscreen()" title="全屏">⛶</button>
          <button class="btn-close" onclick="showPlaceholder()">✕</button>
        </div>
      </div>
      <div class="compose-form">
        <div class="field-row"><span class="field-label">收件人</span><input class="field-input" id="cTo" placeholder="example@domain.com" value="${esc(opts.to||'')}"></div>
        <div class="field-row"><span class="field-label">抄送</span><input class="field-input" id="cCc" placeholder="可选" value="${esc(opts.cc||'')}"></div>
        <div class="field-row"><span class="field-label">主题</span><input class="field-input" id="cSubject" placeholder="邮件主题" value="${esc(opts.subject||'')}"></div>
        <div class="compose-editor"><textarea id="richEditor"></textarea></div>
        <div class="table-tools">
          <button class="attach-btn" onclick="openTableDialog()">⊞ 插入表格</button>
          <button class="table-tool-btn" onclick="addTableRow()">+ 行</button>
          <button class="table-tool-btn" onclick="addTableColumn()">+ 列</button>
          <button class="table-tool-btn" onclick="toggleHeaderRow()">表头开关</button>
          <button class="table-tool-btn" onclick="toggleStripeRows()">斑马纹</button>
        </div>
        <div class="attach-area" id="attachArea">
          <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎 添加附件</button>
          <input type="file" id="fileInput" style="display:none" multiple onchange="addFiles(this)">
        </div>
      </div>
      <div class="compose-footer">
        <button class="btn-send" id="btnSend" onclick="sendEmail()">📨 发送</button>
        <button class="btn-draft" id="btnDraft" onclick="saveDraft()">💾 保存草稿</button>
        <span class="send-status" id="sendStatus"></span>
        <span class="sig-hint">✍ 签名已自动附加</span>
      </div>
    </div>`;
  initMailEditor(opts.body || '');
}

function buildEditorInitialHtml(initialHtml = '') {
  // 签名不放入编辑区，发送时自动附加——编辑区保持干净
  let html = String(initialHtml || '').trim();
  // 如果是回复/转发带过来的旧内容含签名，先剥离
  html = html.replace(/<div[^>]*data-crm-signature="tpkele"[^>]*>[\s\S]*?<\/div>\s*/gi, '').trim();
  return html || '<p><br></p>';
}

function addFiles(input) {
  Array.from(input.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => { attachments.push({ filename:file.name, content:e.target.result.split(',')[1], contentType:file.type }); renderChips(); };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function renderChips() {
  const area = document.getElementById('attachArea');
  if (!area) return;
  area.innerHTML = `<button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎 添加附件</button>
    <input type="file" id="fileInput" style="display:none" multiple onchange="addFiles(this)">` +
    attachments.map((a,i) => `<div class="attach-chip">📄 ${esc(a.filename)}<span class="rm" onclick="removeFile(${i})">✕</span></div>`).join('');
}

function removeFile(i) { attachments.splice(i,1); renderChips(); }

function replyEmail(to, subject) {
  openCompose({ title:'回复', to, subject: subject.startsWith('Re:')?subject:`Re: ${subject}` });
}

function forwardEmail(subject, body) {
  openCompose({ title:'转发', subject: subject.startsWith('Fwd:')?subject:`Fwd: ${subject}`, body:`<p><br></p><br><hr><p><b>--- 转发邮件 ---</b></p>${body}` });
}

// 简化版：回复/转发/删除当前查看的邮件（避免 inline onclick 转义问题）
function replyCurrent() {
  if (!currentEmailData) return;
  replyEmail(currentEmailData.from_address || '', currentEmailData.subject || '');
}
function forwardCurrent() {
  if (!currentEmailData) return;
  forwardEmail(currentEmailData.subject || '', currentEmailData.body_html || currentEmailData.body_text || '');
}
function deleteCurrent() {
  if (!currentEmailData) return;
  deleteEmail(currentEmailData.id);
}

async function saveDraft() {
  const to       = document.getElementById('cTo')?.value?.trim()    || '';
  const cc       = document.getElementById('cCc')?.value?.trim()    || '';
  const subject  = document.getElementById('cSubject')?.value?.trim() || '';
  const body_html = mailEditor ? mailEditor.getContent() : '';
  const body_text = mailEditor ? mailEditor.getContent({ format:'text' }).trim() : '';
  const statusEl  = document.getElementById('sendStatus');
  const btn       = document.getElementById('btnDraft');

  btn.disabled = true;
  statusEl.textContent = '保存中…'; statusEl.className = 'send-status';

  try {
    const res  = await apiFetch('/api/emails/draft', {
      method: 'POST',
      body: JSON.stringify({ id: editingDraftId, to, cc, subject, body_html, body_text, account_id: currentAccountId }),
    });
    const data = await res.json();
    if (data.success) {
      editingDraftId = data.id || editingDraftId; // 记住 id，下次保存时更新同一条
      statusEl.textContent = '✓ 草稿已保存'; statusEl.className = 'send-status ok';
      // 更新草稿数量徽标
      if (currentFolder === 'DRAFT') loadEmails('DRAFT');
    } else {
      statusEl.textContent = data.message || '保存失败'; statusEl.className = 'send-status err';
    }
  } catch (e) {
    statusEl.textContent = '保存失败：' + e.message; statusEl.className = 'send-status err';
  } finally {
    btn.disabled = false;
  }
}

async function sendEmail() {
  const to       = document.getElementById('cTo')?.value?.trim();
  const cc       = document.getElementById('cCc')?.value?.trim();
  const subject  = document.getElementById('cSubject')?.value?.trim();
  const rawHtml   = mailEditor ? mailEditor.getContent() : '';
  // 发送时自动附加签名（编辑区不显示签名）
  const body_html = rawHtml.includes('data-crm-signature="tpkele"') ? rawHtml : rawHtml + EMAIL_SIGNATURE;
  const body_text = mailEditor ? mailEditor.getContent({ format:'text' }).trim() : '';
  const statusEl  = document.getElementById('sendStatus');
  const btn       = document.getElementById('btnSend');

  if (!to||!subject) { statusEl.textContent='收件人和主题不能为空'; statusEl.className='send-status err'; return; }
  btn.disabled = true; statusEl.textContent='发送中…'; statusEl.className='send-status';

  try {
    const res  = await apiFetch('/api/emails/send', { method:'POST', body: JSON.stringify({ to, cc, subject, body_html, body_text, attachments, account_id: currentAccountId, draft_id: editingDraftId }) });
    const data = await res.json();
    if (data.success) {
      statusEl.textContent='✓ 发送成功'; statusEl.className='send-status ok';
      showToast('邮件发送成功');
      setTimeout(showPlaceholder, 1500);
    } else {
      statusEl.textContent = data.message||'发送失败'; statusEl.className='send-status err'; btn.disabled=false;
    }
  } catch (e) {
    statusEl.textContent='发送失败：'+e.message; statusEl.className='send-status err'; btn.disabled=false;
  }
}

// ── Delete ──
async function deleteEmail(id) {
  if (!confirm('确定删除这封邮件吗？')) return;
  try {
    await apiFetch(`/api/emails/${id}`, { method:'DELETE' });
    showToast('邮件已删除'); showPlaceholder(); loadEmails(currentFolder);
  } catch (e) { showToast('删除失败：'+e.message,'err'); }
}

// ── Fullscreen compose ──
function toggleComposeFullscreen() {
  const panel = document.getElementById('detailPanel');
  const btn   = document.getElementById('btnFullscreen');
  if (!panel || !btn) return;
  const isFs = panel.classList.toggle('fullscreen');
  btn.textContent = isFs ? '⊡' : '⛶';
  btn.title       = isFs ? '退出全屏' : '全屏';
}

// ── Table insert ──
function openTableDialog() {
  if (!mailEditor) return;
  document.getElementById('tblOverlay').classList.add('open');
  document.getElementById('tblDlg').classList.add('open');
  setTimeout(() => document.getElementById('tblRows').focus(), 50);
}

function closeTableDialog() {
  document.getElementById('tblOverlay').classList.remove('open');
  document.getElementById('tblDlg').classList.remove('open');
}

function confirmInsertTable() {
  const rows = Math.max(1, Math.min(20, parseInt(document.getElementById('tblRows').value) || 3));
  const cols = Math.max(1, Math.min(15, parseInt(document.getElementById('tblCols').value) || 3));
  closeTableDialog();
  if (!mailEditor) return;
  mailEditor.focus();
  mailEditor.execCommand('mceInsertTable', false, {
    rows,
    columns: cols,
    options: {
      border: '1',
      styles: { 'border-collapse': 'collapse', border: '1px solid #000' }
    }
  });
}

function addTableRow() {
  if (!mailEditor) return;
  mailEditor.focus();
  mailEditor.execCommand('mceTableInsertRowAfter');
}

function addTableColumn() {
  if (!mailEditor) return;
  mailEditor.focus();
  mailEditor.execCommand('mceTableInsertColAfter');
}

function toggleHeaderRow() {
  if (!mailEditor) return;
  mailEditor.focus();
  mailEditor.execCommand('mceTableToggleHeaderRow');
}

function toggleStripeRows() {
  if (!mailEditor) return;
  mailEditor.focus();
  const node = mailEditor.selection.getNode();
  const table = mailEditor.dom.getParent(node, 'table');
  if (!table) return showToast('请先把光标放在表格内', 'err');
  mailEditor.dom.toggleClass(table, 'is-striped');
}

// ── Init ──
// 如果 URL 带 customer_id，显示一个清除筛选的提示条
if (filterCustomerId) {
  const bar = document.createElement('div');
  bar.style.cssText = 'background:rgba(0,200,255,.08);border:1px solid rgba(0,200,255,.3);padding:8px 14px;font-size:12.5px;display:flex;align-items:center;gap:10px;color:var(--text)';
  bar.innerHTML = `<span>📩 仅显示客户「<b>${filterCustomerName || filterCustomerId.slice(0,8)+'…'}</b>」的邮件</span>
    <button onclick="clearCustomerFilter()" style="margin-left:auto;padding:4px 10px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted2);cursor:pointer;font-size:12px">✕ 清除筛选</button>`;
  document.body.insertBefore(bar, document.body.firstChild);
}
function clearCustomerFilter() {
  filterCustomerId = null;
  filterCustomerName = '';
  history.replaceState(null, '', location.pathname);
  location.reload();
}

// 处理 URL 参数：?compose=1 直接打开写信，?folder=INQUIRY 跳转到询盘文件夹
const _qp = new URLSearchParams(location.search);
const _initialFolder = _qp.get('folder') === 'INQUIRY' ? 'INQUIRY' : 'INBOX';
if (_initialFolder === 'INQUIRY') {
  currentFolder = 'INQUIRY';
  document.getElementById('listTitle').textContent = '网站询盘';
}

loadEmails(_initialFolder);
loadAccounts();   // 渲染树时会顺带刷新询盘徽标

// 如果带 compose 参数，自动打开写信界面（延迟一下让 CSS 就位）
if (_qp.get('compose') === '1') {
  setTimeout(() => {
    openCompose({
      to:      _qp.get('to')      || '',
      subject: _qp.get('subject') || '',
      body:    (_qp.get('body')   || '').replace(/\n/g, '<br>'),
    });
  }, 200);
}
